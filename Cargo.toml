[package]
name = "imge"
version = "0.0.2"
default-run = "imge"
edition = "2024"
description = "Fast, lightweight native image viewer and manipulation application inspired by IrfanView"
license = "MIT"
readme = "README.md"
keywords = ["image-viewer", "image-editor", "irfanview", "gui", "egui"]
categories = ["graphics", "gui"]

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "tiff", "ico", "gif"] }
arboard = "3.4"
rfd = "0.15"
kamadak-exif = "0.6.1"
turbojpeg = { version = "1.5.1", default-features = false, features = ["pkg-config"] }
raw-window-handle = "0.6"
x11rb = { version = "0.13", default-features = false, features = ["dl-libxcb", "allow-unsafe-code"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[[bin]]
name = "imge"
path = "src/main.rs"

[[bin]]
name = "bench_suite"
path = "bench/bench_suite.rs"



