[package]
name = "imge"
version = "0.1.0"
edition = "2024"
description = "Fast, lightweight native image viewer and manipulation application inspired by IrfanView"
license = "MIT"
readme = "README.md"
keywords = ["image-viewer", "image-editor", "irfanview", "gui", "egui"]
categories = ["graphics", "gui"]

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "tiff", "ico"] }
arboard = "3.4"
rfd = "0.15"
kamadak-exif = "0.6.1"
turbojpeg = { version = "1.5.1", default-features = false, features = ["pkg-config"] }
